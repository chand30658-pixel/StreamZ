name: StreamZ Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare Android Gradle wrapper
        run: |
          echo "flutter.sdk=$HOME/flutter" > android/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          cd android
          gradle wrapper --gradle-version 8.11.1
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        run: flutter pub get

      - name: Check Android embedding
        run: |
          echo "Checking host Android activity and manifest..."
          grep -RInE 'io\.flutter\.app|FlutterApplication|io\.flutter\.plugin\.common\.PluginRegistry' android 2>/dev/null || true

      - name: Check dependency embedding
        run: |
          echo "Searching pub cache for legacy Flutter v1 Android embedding..."
          grep -RInE 'io\.flutter\.app|FlutterApplication|io\.flutter\.plugin\.common\.PluginRegistry' "$HOME/.pub-cache/hosted/pub.dev" 2>/dev/null | head -100 || true
      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease -Pflutter.versionCode=${{ github.run_number }} -Pflutter.versionName=1.0.0
