name: StreamZ Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamz-android-apk-main
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build and publish Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Restore Android project tooling
        run: |
          flutter create --platforms=android --project-name=streamz_tv --no-pub .
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/StreamZ-TV-release.apk
          echo "size=$(du -h release/StreamZ-TV-release.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh release/StreamZ-TV-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamZ-TV-apk-${{ github.run_number }}
          path: release/StreamZ-TV-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          gh release create "$TAG" release/StreamZ-TV-release.apk \
            --title "StreamZ TV build ${{ github.run_number }}" \
            --prerelease \
            --generate-notes \
            --notes "Automated Android TV APK build from main.

Commit: ${{ github.sha }}
APK size: ${{ steps.apk.outputs.size }}

Install the APK on an Android TV / Google TV device for testing."
