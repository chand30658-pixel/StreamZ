name: StreamZ Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare Android Gradle wrapper
        run: |
          echo "flutter.sdk=$HOME/flutter" > android/local.properties
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          cd android
          gradle wrapper --gradle-version 9.3.1
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.0

      - name: Prepare release APK
        id: apk
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/StreamZ-TV-release.apk
          echo "size=$(du -h release/StreamZ-TV-release.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamZ-TV-apk-${{ github.run_number }}
          path: release/StreamZ-TV-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          TITLE="StreamZ TV build ${{ github.run_number }}"
          gh release create "$TAG" release/StreamZ-TV-release.apk             --title "$TITLE"             --prerelease             --generate-notes             --notes "Automated Android TV APK build from main.

Commit: ${{ github.sha }}
APK size: ${{ steps.apk.outputs.size }}

Install the APK on an Android TV / Google TV device for testing."
