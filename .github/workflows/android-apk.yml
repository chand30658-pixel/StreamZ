name: StreamZ Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Android
        shell: bash
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Flutter packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER --build-name=1.0.0

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/StreamZ-TV-release.apk
          ls -lh release/StreamZ-TV-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamZ-TV-apk-${{ github.run_number }}
          path: release/StreamZ-TV-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v1.0.0-build.${{ github.run_number }}"
          gh release create "$tag" release/StreamZ-TV-release.apk             --title "StreamZ TV build ${{ github.run_number }}"             --prerelease             --generate-notes
