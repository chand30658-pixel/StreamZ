name: StreamZ Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Restore Android tooling
        run: flutter create --platforms=android --project-name=streamz_tv --no-pub .

      - name: Get packages
        run: flutter pub get

      - name: Check Android embedding
        run: |
          echo "Searching Android project for legacy Flutter v1 embedding markers..."
          grep -RInE 'io\.flutter\.app|FlutterApplication|FlutterActivity' android || true

      - name: Check dependency embedding
        run: |
          echo "Searching pub cache for legacy Flutter v1 Android embedding..."
          grep -RInE 'io\.flutter\.app|FlutterApplication|io\.flutter\.plugin\.common\.PluginRegistry' "$HOME/.pub-cache/hosted/pub.dev" 2>/dev/null | head -100 || true

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
